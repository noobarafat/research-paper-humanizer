<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Research Paper Humanizer: humanize AI-assisted academic writing without changing a single number, citation or claim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16294a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e6b"/>
      <stop offset="1" stop-color="#f7c873"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#dots)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- pill -->
    <rect x="64" y="64" width="150" height="32" rx="16" fill="none" stroke="#f59e6b" stroke-width="1.5"/>
    <text x="139" y="85" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#f7c873">CLAUDE SKILL</text>

    <!-- title -->
    <text x="64" y="168" font-size="60" font-weight="800" fill="#ffffff">Research Paper</text>
    <text x="64" y="234" font-size="60" font-weight="800" fill="url(#accent)">Humanizer</text>

    <!-- subtitle -->
    <text x="64" y="284" font-size="22" fill="#b8c4d9">Humanize AI-assisted academic writing without changing</text>
    <text x="64" y="314" font-size="22" fill="#b8c4d9">a single number, citation or claim.</text>

    <!-- chips -->
    <g font-size="14" font-weight="600" fill="#dbe4f3">
      <rect x="64" y="346" width="96" height="30" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="112" y="366" text-anchor="middle">Turnitin</text>
      <rect x="170" y="346" width="96" height="30" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="218" y="366" text-anchor="middle">GPTZero</text>
      <rect x="276" y="346" width="124" height="30" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="338" y="366" text-anchor="middle">Originality.ai</text>
      <rect x="410" y="346" width="168" height="30" rx="8" fill="#ffffff" fill-opacity="0.08"/>
      <text x="494" y="366" text-anchor="middle">IEEE and Q1 journals</text>
    </g>

    <!-- card A: AI draft -->
    <g filter="url(#shadow)">
      <rect x="760" y="64" width="210" height="290" rx="14" fill="#1d2b45" stroke="#33466b"/>
    </g>
    <text x="784" y="100" font-size="13" font-weight="700" letter-spacing="1.5" fill="#ff8f8f">AI DRAFT</text>
    <g fill="#4a5d82">
      <rect x="784" y="124" width="162" height="9" rx="4"/>
      <rect x="784" y="146" width="162" height="9" rx="4"/>
      <rect x="784" y="168" width="162" height="9" rx="4"/>
      <rect x="784" y="190" width="162" height="9" rx="4"/>
      <rect x="784" y="212" width="162" height="9" rx="4"/>
      <rect x="784" y="234" width="162" height="9" rx="4"/>
      <rect x="784" y="256" width="162" height="9" rx="4"/>
    </g>
    <g fill="#ff6b6b" fill-opacity="0.85">
      <rect x="784" y="124" width="52" height="9" rx="4"/>
      <rect x="880" y="168" width="66" height="9" rx="4"/>
      <rect x="810" y="212" width="58" height="9" rx="4"/>
      <rect x="784" y="256" width="72" height="9" rx="4"/>
    </g>
    <g font-size="12" fill="#ffb4b4">
      <text x="784" y="296">delve · pivotal · notably</text>
      <text x="784" y="318">, highlighting the...</text>
    </g>

    <!-- arrow -->
    <g stroke="#f7b26f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M986 210 H1030"/>
      <path d="M1020 200 L1032 210 L1020 220"/>
    </g>

    <!-- card B: humanized -->
    <g filter="url(#shadow)">
      <rect x="1046" y="64" width="190" height="290" rx="14" fill="#f4f7fb"/>
    </g>
    <text x="1068" y="100" font-size="13" font-weight="700" letter-spacing="1.5" fill="#15803d">HUMANIZED</text>
    <g fill="#c3cddc">
      <rect x="1068" y="124" width="146" height="9" rx="4"/>
      <rect x="1068" y="146" width="88" height="9" rx="4"/>
      <rect x="1068" y="168" width="146" height="9" rx="4"/>
      <rect x="1068" y="190" width="146" height="9" rx="4"/>
      <rect x="1068" y="212" width="112" height="9" rx="4"/>
      <rect x="1068" y="234" width="64" height="9" rx="4"/>
      <rect x="1068" y="256" width="146" height="9" rx="4"/>
    </g>
    <circle cx="1080" cy="306" r="12" fill="#16a34a"/>
    <path d="M1074 306 L1078.5 310.5 L1087 301.5" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1100" y="301" font-size="12" font-weight="700" fill="#14532d">Meaning, numbers,</text>
    <text x="1100" y="317" font-size="12" font-weight="700" fill="#14532d">citations unchanged</text>
  </g>
</svg>
